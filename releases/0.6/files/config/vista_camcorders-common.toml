[recording]
	#Frames per second recorded in SP mode.
	# Default: 30
	# Range: 1 ~ 60
	sp_fps = 30
	#Maximum SP cassette length in seconds.
	# Default: 120
	# Range: 10 ~ 3600
	sp_max_seconds = 120
	#Frames per second recorded in EP mode.
	# Default: 15
	# Range: 1 ~ 60
	ep_fps = 15
	#Maximum EP cassette length in seconds.
	# Default: 240
	# Range: 10 ~ 3600
	ep_max_seconds = 240
