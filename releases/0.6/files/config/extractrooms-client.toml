[hud]
	#Show the remaining-seconds label (e.g. '120s') beneath the timer icon.
	showTimerText = true
	#Show the squad health HUD while in the backrooms.
	showSquadHud = true
	#Compact mode: show 1 heart icon + HP/maxHP text instead of a full heart bar per member. Default: false.
	compactSquadHud = false
	#Horizontal alignment of the squad HUD. LEFT = left edge, CENTERED = screen centre, RIGHT = right edge.
	#Allowed Values: LEFT, CENTERED, RIGHT
	squadHudAlignment = "LEFT"

[screen_shake]
	#Toggle all screen shake effects in the mod (lockdown doors, Gaping shriek, Smiler roar, etc.).
	toggleScreenShake = true
	#Global multiplier for screen shake intensity (0.0 = no shake, 1.0 = default, up to 5.0).
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	screenShakeIntensity = 1.0
	#Maximum distance in blocks from an impact source to receive proximity screen shake.
	# Default: 32.0
	# Range: 4.0 ~ 128.0
	screenShakeMaxDistance = 32.0

[timer_effects]
	#Toggle the Warden heartbeat sound played in sync with the HUD red heartbeat vignette as timer drains.
	#Volume is tied to vanilla's Ambient/Environment sound slider — no separate mod volume control.
	toggleHeartbeatSound = true
	#Toggle dynamic FOV extension as the timer drains.
	toggleDynamicFov = true
	#Maximum FOV extension multiplier at 1% time remaining (0.15 = +15% / Speed I default, 0.0 = no extension, up to 0.50 = +50%).
	# Default: 0.15
	# Range: 0.0 ~ 0.5
	timerFovMaxExtension = 0.15
	#Toggle a subtle FOV pulse on each heartbeat beat.
	toggleFovPulse = true
	#Intensity multiplier of the heartbeat FOV pulse (0.02 = +2% default peak expansion, up to 0.10 = +10%).
	# Default: 0.02
	# Range: 0.0 ~ 0.1
	timerFovPulseIntensity = 0.02

[visuals_audio]
	#Toggle lightmap darkness crush in the Backrooms dimension.
	toggleLightmapCrush = true
	#Exponent power applied to lightmap luminance (higher = darker distant light, default 8.0).
	# Default: 8.0
	# Range: 1.0 ~ 16.0
	lightmapCrushPower = 8.0
	#Floor light level applied to lit Backrooms rooms — light never renders darker than this outside dark zones.
	# Default: 5
	# Range: 0 ~ 15
	backroomsLightMin = 5
	#Ceiling light level for the Backrooms — caps how much light (including bleed from distant lamps) can render into a dark room. 15 = uncapped.
	# Default: 15
	# Range: 0 ~ 15
	backroomsLightMax = 15
	#During overtime, every light level in the Backrooms is capped to appear no brighter than this
	#(purely a client-side lightmap remap — no lamp block state is ever touched). 2 (default) keeps a faint glow; 0 is pitch black.
	# Default: 2
	# Range: 0 ~ 15
	overtimeLightCapLevel = 2
	#Scan radius in blocks for glaring lamp ambient buzz audio.
	#Volume is tied to vanilla's Ambient/Environment sound slider — no separate mod volume control.
	# Default: 12
	# Range: 1 ~ 32
	lampBuzzRadius = 12
	#Overall strength of the timer/overtime screen vignette (0 = off, 1 = default). Shape/hardness/exposure are fixed for a consistent look.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	vignetteIntensity = 1.0
