[audio]
	#Record Minecraft sounds heard by the camcorder user.
	record_game_audio = true
	#Record the camcorder user's unmuted Simple Voice Chat microphone.
	record_own_voice = true
	#Record Simple Voice Chat audio heard by the camcorder user.
	record_other_voices = true

[display]
	#Show the camcorder viewfinder OSD.
	show_osd = true
