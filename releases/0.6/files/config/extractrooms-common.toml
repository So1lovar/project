#Extractrooms configuration.
#Changes to this file require a server /reload or full restart to take effect.
#In-game config screen changes are applied immediately via the Save button.
[world]
	#Allow Noise blocks to be displaced by placing a block on them, triggering the spread chain.
	noiseSpreadEnabled = true
	#Chance (0.0–1.0) that placing a block on a Noise pool clones that exact block across the entire chain.
	#Default: 0.01 (1%). At 1.0, every trigger clones the placed block.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	noiseCloneChance = 0.01
	#Damage dealt per hit to any living entity standing on a Noise block (in half-hearts).
	# Default: 1.0
	# Range: 0.0 ~ 20.0
	noiseBurnDamage = 1.0
	#How often (in ticks) a Noise block deals damage to an entity standing on it. Default: 2 (every other tick).
	# Default: 2
	# Range: 1 ~ 100
	noiseBurnInterval = 2

[integrity]
	#Block players from teleporting into the backrooms without a legitimate run.
	#Covers mods like TempPad, the Backrooms mod, and any cross-dimension teleport that bypasses the entry mechanic.
	#Players who arrive without an active run are immediately sent back to their respawn point.
	preventUnauthorizedEntry = true
	#Allow server operators (permission level 2+) to enter, exit, and teleport in the backrooms freely.
	#On by default — enables server operators to freely inspect, build, or teleport without restrictions.
	allowAdminEntry = false
	#Cancel teleportation events while a player is inside the backrooms.
	#Blocks ender pearls, chorus fruit, and mod teleports (e.g. minimap 'go to waypoint') from working inside the dimension.
	#Does not affect vanilla /tp (admin command). Does not affect the exit portal.
	#Minimap mods (Xaero's, JourneyMap): this blocks waypoint teleportation.
	#To disable map rendering in this dimension, configure your minimap mod directly.
	blockInDimensionTeleport = true
	#Force inventory drops on death inside the backrooms, even if keepInventory is enabled.
	#Prevents mods or gamerule hacks from letting players keep their gear after dying.
	#Loot dropped this way still ends up on the backrooms floor — the player has to find it again.
	forceDropOnDeath = true
	#How many ticks a player has to escape before the timer kills them (20 ticks = 1 second).
	#Default: 6000 (5 minutes). Set to 0 to disable the timer entirely.
	# Default: 6000
	# Range: 0 ~ 720000
	runTimerTicks = 6000
	#Ticks remaining on the run timer when the alarm reminder fires (20 ticks = 1 second, 1200 = 60s).
	#Set to -1 to disable the reminder entirely.
	# Default: 1200
	# Range: > -1
	timerReminderTicks = 1200
	#Radius in blocks around an entry point in the source dimension within which another player joining will join the active squad run.
	# Default: 16.0
	# Range: 1.0 ~ 128.0
	squadJoinRadius = 16.0
	#Radius in blocks inside the backrooms within which a player entering will join a squad whose member's last known position is nearby. Used to group players who fall through separate shafts into the same area.
	# Default: 128.0
	# Range: 1.0 ~ 512.0
	squadBackroomsJoinRadius = 128.0
	#Bonus time in ticks added to the shared squad timer for each extra squad member beyond the first (20 ticks = 1s, 1200 = 60s).
	# Default: 600
	# Range: 0 ~ 36000
	squadBonusTicksPerMember = 600
	#Maximum number of players allowed in a single squad. Players who enter after a squad is full automatically start or join a new squad.
	# Default: 4
	# Range: 2 ~ 8
	squadMaxSize = 4
	#Minimum delay (ticks) between flicker toggles for a Glaring Lamp flagged via ExtractroomsAPI/addon content — not used automatically during overtime any more (see the client-side overtimeLightCapLevel option instead).
	# Default: 4
	# Range: 1 ~ 200
	overtimeLampFlickerMinTicks = 4
	#Maximum delay (ticks) between flicker toggles — each flagged lamp reschedules itself with a random delay in [min, max], so a group of them flickers unsynchronized/chaotic rather than in lockstep.
	# Default: 12
	# Range: 1 ~ 200
	overtimeLampFlickerMaxTicks = 12

[entities]
	#Light level threshold above which Smilers cannot enter and despawn when caught in light.
	# Default: 8
	# Range: 0 ~ 15
	smilerLightThreshold = 8
	#If true, a player simply holding a light-emitting item/block kills nearby Smilers the same
	#way placing one does, using that item's own light level to compute how far it reaches (same
	#falloff math as a real placed light source). Off by default: holding an unlit torch doesn't
	#actually light up the world for players without a dynamic-lighting mod/pack, so this only makes
	#sense to enable on servers where players have one that reaches real world light.
	smilerHeldLightKills = false
	#Follow range in blocks for Gaping entity.
	# Default: 36.0
	# Range: 4.0 ~ 256.0
	gapingFollowRange = 36.0
	#Duration in ticks that Gaping remains enraged after taking damage.
	# Default: 200
	# Range: 20 ~ 2400
	gapingAggroDurationTicks = 200
	#Distance in blocks from guarded eggs beyond which a PARENT Gaping de-aggros if no eggs have been broken.
	# Default: 16.0
	# Range: 2.0 ~ 64.0
	gapingParentDeaggroRange = 16.0
	#Follow range in blocks for Gaping Hatchling entity.
	# Default: 24.0
	# Range: 4.0 ~ 256.0
	gapingHatchlingFollowRange = 24.0
	#Ticks an untamed Gaping Hatchling takes to grow into an adult Gaping (default 600 = ~30 seconds). Taming stops this timer permanently.
	# Default: 600
	# Range: > 20
	gapingHatchlingGrowTicks = 600
	#If true, Gaping Hatchlings pick a random skin from the adult Gaping's texture pool instead of always using the default hatchling texture.
	gapingHatchlingRandomVariant = false
	#Maximum number of Noise blocks that can convert (and play a break sound) in a single tick; the rest of a large spread wave is deferred to later ticks instead of all playing at once.
	# Default: 8
	# Range: 1 ~ 512
	noiseMaxSoundsPerTick = 8
	#Cooldown in ticks between step moves for Chomper.
	# Default: 10
	# Range: 1 ~ 100
	chomperStepCooldown = 10
	#Block scan radius for Chomper hunting floor light sources.
	# Default: 20
	# Range: 1 ~ 64
	chomperLightHuntRadius = 20
	#Number of hits required from player to release grab from Trader.
	# Default: 3
	# Range: 1 ~ 20
	traderHitsToEscape = 3

[lockdown_door]
	#Closing speed of lockdown shutter doors in ticks per Y-level (higher = slower). Default: 6.0 (a 4x4 portal closes in 24 ticks / 1.2s).
	# Default: 6.0
	# Range: 0.5 ~ 40.0
	speedTicksPerLevel = 6.0
	#Retraction (opening) speed of lockdown shutter doors in ticks per Y-level (higher = slower). Default: 8.0 (mechanical constant speed, a 4x4 portal retracts in 32 ticks / 1.6s).
	# Default: 8.0
	# Range: 1.0 ~ 80.0
	retractionSpeedTicksPerLevel = 8.0
	#Damage dealt per hit to entities trapped underneath a descending lockdown shutter (in half-hearts). Default: 20.0.
	# Default: 20.0
	# Range: 0.0 ~ 100.0
	crushDamage = 20.0
	#Duration in milliseconds of screen shake triggered when a lockdown door impacts the floor or an obstruction.
	# Default: 350
	# Range: 0 ~ 5000
	shakeDurationMs = 350
	#Intensity multiplier of screen shake triggered when a lockdown door impacts the floor or an obstruction.
	# Default: 3.5
	# Range: 0.0 ~ 20.0
	shakeIntensity = 3.5

[debug]
	#Enable detailed, non-spammy diagnostic logging for dimension transfers, world saves, and run escapes.
	debugLogging = false

[almond_water]
	#Toggle whether drinking Almond Water grants extra time to the extraction run.
	toggleAlmondWaterEffect = true
	#The amount of extra time (in seconds) granted when drinking Almond Water.
	# Default: 10
	# Range: 0 ~ 3600
	almondWaterTimeAdded = 10
	#Toggle whether source blocks can create infinite water sources (false = finite like lava).
	almondWaterIsInfinite = false

[liminal_respawn_unit]
	#Number of unique items required to add one charge to the Liminal Respawn Unit.
	# Default: 8
	# Range: 1 ~ 64
	itemsPerCharge = 8
	#Maximum number of charges a Liminal Respawn Unit can hold.
	# Default: 3
	# Range: 1 ~ 3
	maxCharges = 3
	#Number of recently consumed items remembered by the unit that cannot be accepted again.
	# Default: 24
	# Range: 0 ~ 100
	memorySize = 24
	#Total number of items consumed before the unit's consumed items history resets.
	# Default: 27
	# Range: 1 ~ 1000
	memoryResetCount = 27
	#Allow duplicate items to be fed without rejection from the memory history.
	allowDuplicates = false
	#Minimum item stack size required per feed.
	# Default: 1
	# Range: 1 ~ 64
	minItemAmount = 1
	#Maximum item stack size consumed per feed.
	# Default: 1
	# Range: 1 ~ 64
	maxItemAmount = 1
